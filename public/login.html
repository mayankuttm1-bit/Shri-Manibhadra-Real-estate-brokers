<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Shri Manibhadra Real Estate Brokers</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/trs-style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Shri Manibhadra Real Estate Brokers</h2>
                <p>Admin Portal</p>
            </div>
            <div id="login-error" class="login-error" style="display: none;"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-icon-wrapper">
                        <i data-lucide="mail"></i>
                        <input type="email" id="email" required placeholder="admin@manibhadrarealestate.com">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon-wrapper">
                        <i data-lucide="lock"></i>
                        <input type="password" id="password" required placeholder="Enter password">
                        <button type="button" class="toggle-password" id="toggle-password">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary login-btn">Sign In</button>
            </form>
            <div class="login-footer">
                <a href="/">← Back to Homepage</a>
            </div>
        </div>
    </div>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
    <script src="js/auth.js"></script>
</body>
</html>
